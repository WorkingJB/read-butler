# Applies migrations and auth config to the hosted Supabase project.
# PRs touching supabase/ get a dry run; merges to main apply for real.
#
# Repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, RESEND_API_KEY.
name: Supabase

on:
  pull_request:
    paths: ["supabase/**"]
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: owtsriyiyhhsmwizcvfy
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push --dry-run

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push --yes
      - name: Push auth config
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # An empty key would overwrite the SMTP password and break sign-in emails.
          test -n "$RESEND_API_KEY" || { echo "RESEND_API_KEY secret is not set"; exit 1; }
          supabase config push --yes
